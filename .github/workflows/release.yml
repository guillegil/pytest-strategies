name: Release

# Publishes a GitHub Release with the sdist and wheel when a version tag is pushed
# (git tag -a v2.0.0 -m "pytest-strategies 2.0.0" && git push origin v2.0.0),
# then uploads the same files to PyPI through trusted publishing (no API token:
# PyPI trusts this workflow file in the `pypi` environment of this repository).
# A manual run creates the tag on the selected branch first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match pyproject.toml)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check the version
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          version="${VERSION#v}"
          project=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$version" != "$project" ]; then
            echo "::error::Tag v$version does not match version $project in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "pytest-strategies $VERSION"
          git push origin "v$VERSION"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Keep the files for the PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Test the wheel
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl
          cd examples && /tmp/wheel/bin/python -m pytest -p no:cacheprovider -q --rng-seed=1 *.py

      - name: Release notes from the CHANGELOG
        shell: python
        run: |
          import os, pathlib, re, sys

          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]\n]+\]: )",
              changelog,
              re.M | re.S,
          )
          if section is None or not section.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section for {version}")
          pathlib.Path("notes.md").write_text(section.group(1).strip() + "\n", encoding="utf-8")

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$VERSION" dist/*
          --verify-tag
          --title "pytest-strategies $VERSION"
          --notes-file notes.md

  pypi:
    name: PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-strategies/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
