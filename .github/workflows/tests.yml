name: CI

on:
  push:
    branches: [main, develop, migration]
  pull_request:
    branches: [main, develop, migration]

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }}, pytest ${{ matrix.pytest }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        pytest: [latest]
        include:
          # The one coverage run
          - os: ubuntu-latest
            python-version: "3.14"
            pytest: latest
            coverage: true
          # The oldest supported pytest
          - os: ubuntu-latest
            python-version: "3.11"
            pytest: "8.4.2"
          - os: ubuntu-latest
            python-version: "3.14"
            pytest: "8.4.2"
          - os: windows-latest
            python-version: "3.11"
            pytest: latest
          - os: windows-latest
            python-version: "3.14"
            pytest: latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.pytest }}" != "latest" ]; then
            pip install "pytest==${{ matrix.pytest }}"
          fi
          python -m pytest --version

      - name: Run the suite
        if: ${{ !matrix.coverage }}
        run: python -m pytest -n auto

      # coverage run, not pytest-cov: the plugin is imported through its entry
      # point before pytest-cov starts, which would count every module-level
      # line (imports, def and class lines) as missed. One process, no xdist.
      - name: Run the suite with coverage
        if: ${{ matrix.coverage }}
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=90

      - name: Run the sequence tests with --nsamples=auto
        run: python -m pytest tests/integration/test_sequence_integration.py --nsamples=auto

  examples:
    name: Examples, vector modes and xdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Examples
        run: python -m pytest examples/*.py

      - name: Examples with --nsamples=auto
        run: python -m pytest examples/*.py --nsamples=auto

      - name: Examples with --nsamples=5
        run: python -m pytest examples/*.py --nsamples=5

      - name: Test vectors only (--vector-mode=test)
        run: python -m pytest examples/test_values_example.py --vector-mode=test

      # Test IDs name the rows, so a seed changes the values but not the node IDs:
      # the same list for seeds 1 and 2, and under --nsamples=auto, which permutes
      # RNGSequence rows, the same set
      - name: Node IDs do not depend on the seed
        # bash in Actions runs with -o pipefail, so a failing pytest fails the step
        shell: bash
        run: |
          for seed in 1 2; do
            python -m pytest examples/*.py --collect-only -q --rng-seed=$seed | grep "::" > ids-$seed.txt
            python -m pytest examples/*.py --collect-only -q --rng-seed=$seed --nsamples=auto | grep "::" | sort > ids-auto-$seed.txt
          done
          test -s ids-1.txt && test -s ids-auto-1.txt
          diff ids-1.txt ids-2.txt
          diff ids-auto-1.txt ids-auto-2.txt

      - name: -k selects a directed vector by its name
        shell: bash
        run: |
          python -m pytest examples/*.py --collect-only -q -k zeros | grep "::" > selected.txt
          cat selected.txt
          test "$(cat selected.txt)" = "examples/strategy_example.py::test_addition[directed-zeros]"

      - name: One random row by its node ID
        shell: bash
        run: python -m pytest "examples/strategy_example.py::test_addition[rand-3]" --rng-seed=1 -q | tee row.txt && grep -q "^1 passed" row.txt

      - name: Examples with the 3.0 test IDs (-o strategies_ids=values)
        run: python -m pytest examples/*.py -o strategies_ids=values

      # Started in the rootdir with no path on the command line, so the run collects
      # its testpaths and counts as the whole suite: a name that matches no
      # constraint stops it with a usage error instead of a red line.
      - name: An example with its named constraint turned off (--strategy-constraint-off)
        run: python -m pytest -o testpaths=examples -o python_files=test_values_example.py --strategy-constraint-off=date_range_test:ordered

      - name: Examples on two xdist workers, without a seed
        run: python -m pytest examples/*.py -n 2

      - name: Examples on two xdist workers, with a seed
        run: python -m pytest examples/*.py -n 2 --rng-seed=1

      # The examples' runs above exit with code 4 if their two workers generated
      # different values under the same test IDs. These projects check that on two
      # workers: a context, a list built from a set under two hash seeds, the global
      # random, Series values that change the IDs, and workers that agree
      - name: Workers that generate different vectors fail the run (-n 2)
        run: python -m pytest tests/integration/test_xdist_check_integration.py -v

      # Informational: timings depend on the runner, so the step prints them and never
      # fails the job. Compare versions by running the script on one machine
      - name: Benchmark (informational)
        continue-on-error: true
        run: python benchmarks/bench.py --sweep --memory

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: The sdist carries the typing marker and the skill
        run: |
          tar tzf dist/*.tar.gz > sdist.txt
          grep -q "src/pytest_strategy/py.typed$" sdist.txt
          grep -q "src/pytest_strategy/skill/pytest-strategies/SKILL.md$" sdist.txt
          grep -q "src/pytest_strategy/skill/pytest-strategies/references/api.md$" sdist.txt

      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl
          /tmp/wheel/bin/python - <<'EOF'
          from importlib import resources
          import pytest_strategy

          assert "site-packages" in pytest_strategy.__file__, pytest_strategy.__file__
          root = resources.files("pytest_strategy")
          for name in ("py.typed", "skill/pytest-strategies/SKILL.md", "skill/pytest-strategies/references/api.md"):
              assert (root / name).is_file(), f"{name} is missing from the wheel"
          print("pytest-strategies", pytest_strategy.__version__, "from", pytest_strategy.__file__)
          EOF

      - name: Run the examples from the wheel
        working-directory: examples
        run: /tmp/wheel/bin/python -m pytest -p no:cacheprovider -q --rng-seed=1 *.py

      - name: Install the skill in a project
        run: |
          mkdir /tmp/project && cd /tmp/project
          /tmp/wheel/bin/pytest-strategies skill install --all
          test -f .claude/skills/pytest-strategies/SKILL.md
          test -f .agents/skills/pytest-strategies/SKILL.md
          test -f .agents/skills/pytest-strategies/references/api.md

  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src/ tests/ benchmarks/

      - name: Black
        run: black --check src/ tests/ benchmarks/

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Mypy
        run: mypy --strict src/pytest_strategy/

      - name: The decorators keep the decorated function's type
        run: mypy --strict tests/unittests/test_typing.py
