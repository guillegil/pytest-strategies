[project]
name = "pytest-strategies"
version = "4.0.0"
description = "A pytest plugin for constrained-randomized test parametrization with directed testing support"
authors = [{ name = "Guillermo Gil", email = "guillegirod@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"

keywords = [
    "pytest",
    "plugin",
    "testing",
    "parametrize",
    "random",
    "constrained",
    "property-based",
    "directed-testing",
    "test-generation",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Unit",
    "Typing :: Typed",
]

dependencies = ["pytest>=8.4.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.6",
    "black>=26.1,<27",
    "ruff>=0.13",
    "mypy>=2.0",
    "pre-commit>=4.0",
    # Record mode's tests use real pydantic models and attrs classes
    "pydantic>=2",
    "attrs",
]

[project.urls]
Homepage = "https://github.com/guillegil/pytest-strategies"
Repository = "https://github.com/guillegil/pytest-strategies"
Documentation = "https://github.com/guillegil/pytest-strategies/blob/main/docs/dev.md"
"Bug Tracker" = "https://github.com/guillegil/pytest-strategies/issues"
Changelog = "https://github.com/guillegil/pytest-strategies/blob/main/CHANGELOG.md"

[project.scripts]
pytest-strategies = "pytest_strategy._cli:main"

[project.entry-points.pytest11]
pytest_strategy = "pytest_strategy.plugin"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytest_strategy*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
# The agent skill (skill/pytest-strategies/) is package data, read with importlib.resources
pytest_strategy = ["py.typed", "skill/**/*.md"]

# ============================================================================
# BLACK - Code Formatting
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''

# ============================================================================
# RUFF - Linting
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "B905", # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]            # Allow unused imports in __init__.py
"tests/**/*.py" = ["ARG"]           # Allow unused arguments in tests
"src/pytest_strategy/plugin.py" = ["ARG002"] # pytest hooks declare contract args even when unused

# ============================================================================
# MYPY - Type Checking
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = true

# ============================================================================
# PYTEST - Testing Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.4.2"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-ra", # Show summary of all test outcomes
    "--strict-markers", # Raise error on unknown markers
    "--strict-config", # Raise error on unknown config options
]
# A strategy that yields no rows fails collection instead of skipping silently
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
    "error",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ============================================================================
# COVERAGE - Code Coverage
# ============================================================================
[tool.coverage.run]
source = ["pytest_strategy"]
branch = true
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# ISORT - Import Sorting (if not using ruff for this)
# ============================================================================
[tool.isort]

profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
